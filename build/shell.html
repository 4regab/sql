<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6f8" />
<title>%%TITLE%%</title>
<meta name="description" content="%%DESC%%" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="%%FONTS%%" rel="stylesheet" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body data-key="%%KEY%%">

<div class="progress" id="progress"><i></i></div>

<header class="chrome" id="chrome">
  <button class="menu" id="menuBtn" type="button" aria-label="Open contents" aria-expanded="false" aria-controls="drawer">
    <span class="burger" aria-hidden="true"><i></i><i></i></span><span class="menu-l">Contents</span>
  </button>
  <p class="now" id="now" aria-live="polite"><span class="now-n" id="nowN"></span><span class="now-t" id="nowT">Front page</span></p>
  <p class="xp" id="xp" title="Experience points earned"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg><span id="xpVal">0</span><span class="xp-u">XP</span></p>
</header>

<nav class="rail" id="rail" aria-label="Sections"></nav>

<aside class="drawer" id="drawer" aria-label="Contents" aria-hidden="true" inert>
  <div class="dr-top">
    <p class="dr-eb">Contents</p>
    <button class="dr-x" id="drClose" type="button" aria-label="Close contents"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="dr-nav" id="drNav"></nav>
  <div class="dr-foot">
    <a href="#results" class="dr-link">Results</a>
    <button type="button" class="dr-link danger" id="resetBtn">Reset progress</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main id="main">
  <section class="hero" id="top" data-ch="intro">
    <div class="wrap hero-in">
      <div class="hero-copy">
        <p class="hero-k">%%COURSE%%</p>
        <h1 class="hero-t">%%HEADLINE%%</h1>
        <p class="hero-d">%%DECK%%</p>
        <div class="hero-stats">%%STATS%%</div>
        <a class="hero-cta" href="#rooms"><span>Start learning</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      </div>
      <div class="hero-demo" aria-hidden="true">
        <div class="hd-bar"><span class="sql-dot"><i></i><i></i><i></i></span>query.sql</div>
        <pre class="hd-q"><code id="heroQ"></code></pre>
        <div class="hd-grid" id="heroGrid"></div>
      </div>
    </div>
  </section>

  <section class="toc" id="rooms" data-ch="intro">
    <div class="wrap">
      <p class="toc-k">%%SOURCES%%</p>
      <h2 class="toc-t">%%ROOMSTITLE%%</h2>
      <div class="toc-grid">%%ROOMS%%</div>
    </div>
  </section>

%%CHAPTERS%%

  <section class="results" id="results" data-ch="results">
    <div class="wrap narrow res-in">
      <p class="kicker">Summary</p>
      <h2 class="res-t">Your results</h2>
      <div class="ring"><svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="74" class="r-bg"/><circle cx="84" cy="84" r="74" class="r-fg" id="ring"/></svg><p class="ring-v" id="ringVal">0%</p></div>
      <p class="res-text" id="resText"></p>
      <div class="rows" id="rows"></div>
    </div>
  </section>
  <footer class="foot wrap"><p>%%EDITION%% · %%SOURCES%%</p></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="navData">%%NAV%%</script>
<script src="js/gsap.min.js"></script>
<script src="js/ScrollTrigger.min.js"></script>
<script src="js/SplitText.min.js"></script>
<script src="js/quiz.js"></script>
<script src="js/core.js"></script>
<script src="js/quizapp.js"></script>
<script src="js/widgets.js"></script>
<script src="js/sqllab.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
